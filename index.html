<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flappy Fly</title>
<meta name="description" content="Fruit fly Flappy Bird — inspired by the TuragaLab/flybody MuJoCo neuromechanical model. Flap to rise, dodge Mario-style green pipes, ground contact is fatal! Live synapse monitor and a global leaderboard included.">
<meta property="og:title" content="Flappy Fly">
<meta property="og:description" content="A fruit fly tribute to the flybody neuromechanical model: flap to rise, dodge green pipes, ground is fatal — with a live synapse monitor and global leaderboard.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪰</text></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="stage">
  <div class="game-wrap">
    <canvas id="game" width="480" height="720" aria-label="Flappy Fly game"></canvas>
    <div id="submitBar">
      <div class="sb-row">
        <input id="nameInput" maxlength="8" placeholder="Your name (≤8)" autocomplete="off">
        <button id="submitBtn">SUBMIT</button>
      </div>
      <div id="submitMsg"></div>
    </div>
  </div>
  <aside class="brain-panel">
    <canvas id="brain" aria-label="Synaptic activity monitor"></canvas>
    <div id="lb">
      <div class="lb-title"><span>GLOBAL LEADERBOARD · TOP 5</span><span id="lbStatus"></span></div>
      <ol id="lbList"></ol>
    </div>
  </aside>
</div>
<script src="brain.js"></script>
<script src="leaderboard.js"></script>
<script src="game.js"></script>
</body>
</html>
